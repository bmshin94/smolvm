[package]
name = "smolvm-hip-shim"
version = "0.1.0"
edition = "2021"
description = "Guest-side libamdhip64.so drop-in: HIP runtime over smolvm's vsock RPC"
license = "Apache-2.0"

[lib]
name = "amdhip64"
crate-type = ["cdylib"]

[dependencies]
smolvm-hip = { path = "../smolvm-hip", default-features = false }
libc = "0.2"

# vsock is the production transport (guest -> host CID 2). Off Linux the crate
# still compiles (tcp/unix transports only) so the workspace builds everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
