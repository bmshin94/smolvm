name: Build libkrun (linux, glibc 2.35)

# Rebuild the bundled linux libkrun.so on ubuntu-22.04 so its glibc floor is
# 2.35 — the same floor the release binaries get (they also build on 22.04, see
# release.yml). A libkrun built on a newer distro (e.g. Ubuntu 24.04 / glibc
# 2.39) loads fine there but fails on 22.04 with "GLIBC_2.39 not found", which is
# exactly how a hand-built lib slipped a 2.39 floor into v1.2.0.
#
# SKIP_LIBKRUNFW=1: reuse the committed lib/linux-<arch>/libkrunfw.so (it wraps a
# guest-kernel blob, floor GLIBC_2.2 — host-glibc-independent), so we skip the
# multi-minute kernel rebuild and only recompile libkrun itself.
#
# Dispatch-only. Uploads lib/linux-<arch>/ as an artifact; the rebuilt .so is
# then committed into the repo (git-LFS) and shipped in the next release.

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Build only the Windows runtime bundle."
        type: boolean
        default: false
      macos_runtime_run:
        description: "Build only the macOS QA engine using the runtime artifact from this workflow run ID."
        type: string
        default: ""
      macos_only:
        description: "Build only the macOS runtime bundle."
        type: boolean
        default: false
      rebuild_libkrunfw:
        description: "Rebuild libkrunfw from source (full guest-kernel rebuild) instead of reusing the committed .so. Needed when a libkrunfw patch changed the guest kernel."
        type: boolean
        default: false

jobs:
  build:
    if: ${{ !inputs.windows_only && !inputs.macos_only && inputs.macos_runtime_run == '' }}
    name: libkrun ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # libkrun links against the libkrunfw source
          lfs: true               # committed libkrunfw.so reused under SKIP_LIBKRUNFW

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      # By default reuse the committed libkrunfw.so (skips the multi-minute guest
      # kernel rebuild). When a libkrunfw patch changed the guest kernel, dispatch
      # with rebuild_libkrunfw=true so libkrunfw.so is rebuilt from the submodule
      # source and picked up here.
      - name: Build libkrun (GPU=1)
        run: |
          if [ "${{ inputs.rebuild_libkrunfw }}" = "true" ]; then
            echo "Rebuilding libkrunfw from source"
            GPU=1 ./scripts/build-libkrun-linux.sh
          else
            SKIP_LIBKRUNFW=1 GPU=1 ./scripts/build-libkrun-linux.sh
          fi

      - name: Assert glibc floor <= 2.35
        run: |
          so="lib/linux-${{ matrix.arch }}/libkrun.so"
          maxv=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "max GLIBC required by $so: ${maxv:-none}"
          if [ -n "$maxv" ] && [ "$(printf '%s\n2.35\n' "$maxv" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::$so requires glibc $maxv (> 2.35) — floor not lowered"
            exit 1
          fi
          echo "OK: glibc floor is <= 2.35"

      - uses: actions/upload-artifact@v4
        with:
          name: libkrun-linux-${{ matrix.arch }}
          path: lib/linux-${{ matrix.arch }}/
          if-no-files-found: error

  # Build the Windows host library from the same pinned source. Checkpoint
  # support is platform-gated in smolvm, but every shipped libkrun artifact
  # must still match the pin so an unrelated release cannot silently retain an
  # older runtime.
  windows-libkrun:
    if: ${{ !inputs.macos_only && inputs.macos_runtime_run == '' }}
    name: libkrun windows-x86_64
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 musl-tools clang libclang-dev

      - name: Build libkrun (BLK=1 NET=1)
        run: |
          export CARGO_BUILD_TARGET=x86_64-pc-windows-gnu
          # Keep the canonical Make feature/build path; override its Linux
          # output locations for this Windows cross-compilation artifact.
          make -C libkrun BLK=1 NET=1 \
            FEATURE_FLAGS='--features blk,net --package libkrun' \
            KRUN_BASE_Linux=../x86_64-pc-windows-gnu/release/krun.dll \
            LIBRARY_RELEASE_Linux=target/krun-windows.dll target/krun-windows.dll
          cp libkrun/target/krun-windows.dll lib/windows-x86_64/krun.dll
          ./scripts/stamp-libkrun-provenance.sh lib/windows-x86_64 --skip-libkrunfw

      - uses: actions/upload-artifact@v4
        with:
          name: libkrun-windows-x86_64
          path: lib/windows-x86_64/
          if-no-files-found: error

  # Cross-build the Windows libkrunfw.dll (guest kernel wrapped for a Windows
  # host) with mingw-w64 on Linux. The kernel builds with native gcc; only the
  # final bundle link uses the mingw toolchain (Makefile OS=Windows path). Only
  # runs when refreshing libkrunfw, since the .dll wraps the guest kernel.
  windows-libkrunfw:
    name: libkrunfw.dll (windows cross)
    if: ${{ inputs.rebuild_libkrunfw && !inputs.macos_only && inputs.macos_runtime_run == '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      - name: Install build + mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc bc bison flex libelf-dev libssl-dev \
            python3-pyelftools curl xz-utils cpio kmod gcc-mingw-w64-x86-64

      - name: Build libkrunfw.dll (mingw cross)
        run: cd libkrunfw && make OS=Windows -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-windows-x86_64
          path: libkrunfw/libkrunfw.dll
          if-no-files-found: error

  macos-libkrun:
    name: libkrun darwin-arm64
    if: ${{ inputs.macos_only && inputs.macos_runtime_run == '' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install build dependencies
        run: |
          brew trust --tap libkrun/krun
          brew tap libkrun/krun
          brew install llvm lld xz virglrenderer

      - name: Build and sign the bundled runtime
        run: |
          # Compile with installed headers, but link the same patched graphics
          # libraries that ship with SmolVM, not Homebrew's upstream ABI.
          mkdir -p "$RUNNER_TEMP/krun-pkgconfig" "$RUNNER_TEMP/krun-link-libs"
          ln -s "$GITHUB_WORKSPACE/lib/libepoxy.0.dylib" "$RUNNER_TEMP/krun-link-libs/libepoxy.dylib"
          ln -s "$GITHUB_WORKSPACE/lib/libvirglrenderer.1.dylib" "$RUNNER_TEMP/krun-link-libs/libvirglrenderer.dylib"
          nm -gU "$GITHUB_WORKSPACE/lib/libvirglrenderer.1.dylib" | grep ' _virgl_renderer_resource_get_map_ptr$'
          for dependency in virglrenderer epoxy; do
            pc_dir="$(pkg-config --variable=pcfiledir "$dependency")"
            sed "s|^libdir=.*|libdir=$RUNNER_TEMP/krun-link-libs|" \
              "$pc_dir/$dependency.pc" > "$RUNNER_TEMP/krun-pkgconfig/$dependency.pc"
          done
          export PKG_CONFIG_PATH="$RUNNER_TEMP/krun-pkgconfig"
          pkg-config --libs virglrenderer epoxy
          make -C libkrun smolvm
          ./scripts/stamp-libkrun-provenance.sh lib --skip-libkrunfw
          codesign --verify --strict --verbose=2 lib/libkrun.dylib
          otool -L lib/libkrun.dylib
          shasum -a 256 lib/libkrun.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: libkrun-darwin-arm64
          path: |
            lib/libkrun.dylib
            lib/libkrun.provenance
          if-no-files-found: error

  macos-engine-qa:
    name: Checkpoint engine darwin-arm64
    if: ${{ inputs.macos_runtime_run != '' }}
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: libkrun-darwin-arm64
          run-id: ${{ inputs.macos_runtime_run }}
          github-token: ${{ github.token }}
          path: lib

      - name: Verify the runtime source and signature
        run: |
          grep -Fx "libkrun=$(git rev-parse HEAD:libkrun)" lib/libkrun.provenance
          grep -Fx "libkrunfw=$(git rev-parse HEAD:libkrunfw)" lib/libkrun.provenance
          codesign --verify --strict --verbose=2 lib/libkrun.dylib

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and sign the acceptance engine
        env:
          LIBRARY_PATH: ${{ github.workspace }}/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/lib
        run: |
          cargo build --locked --release --bin smolvm
          codesign --force --sign - --entitlements smolvm.entitlements target/release/smolvm
          codesign --verify --strict --verbose=2 target/release/smolvm
          target/release/smolvm --version
          shasum -a 256 target/release/smolvm

      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-engine-darwin-arm64
          path: target/release/smolvm
          if-no-files-found: error
